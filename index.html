<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project Atlas — Files</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app" class="teams-shell" aria-hidden="false">

  <!-- ===================== LEFT RAIL ===================== -->
  <nav class="rail" aria-label="App navigation">
    <div class="rail-org">
      <div class="org-badge">CA</div>
    </div>
    <button class="rail-btn" tabindex="-1">
      <svg viewBox="0 0 24 24"><path d="M12 2 2 8l10 6 10-6-10-6zM2 16l10 6 10-6M2 12l10 6 10-6"/></svg>
      <span>Activity</span>
    </button>
    <button class="rail-btn" tabindex="-1">
      <svg viewBox="0 0 24 24"><path d="M4 4h16v12H7l-3 3V4z"/></svg>
      <span>Chat</span>
    </button>
    <button class="rail-btn active" tabindex="-1">
      <svg viewBox="0 0 24 24"><path d="M8 3a3 3 0 100 6 3 3 0 000-6zM17 3a3 3 0 100 6 3 3 0 000-6zM3 21v-2a4 4 0 014-4h2a4 4 0 014 4v2M14 21v-1.5a3.5 3.5 0 013.5-3.5h1a3.5 3.5 0 013.5 3.5V21"/></svg>
      <span>Teams</span>
    </button>
    <button class="rail-btn" tabindex="-1">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 9h16M9 5v4"/></svg>
      <span>Calendar</span>
    </button>
    <button class="rail-btn" tabindex="-1">
      <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3 19.5 19.5 0 01-6-6A19.8 19.8 0 012.2 4.2 2 2 0 014.2 2h3a2 2 0 012 1.7c.1 1 .4 2 .7 3a2 2 0 01-.5 2L8 10a16 16 0 006 6l1.3-1.4a2 2 0 012-.5c1 .3 2 .5 3 .7a2 2 0 011.7 2.1z"/></svg>
      <span>Calls</span>
    </button>
    <div class="rail-spacer"></div>
    <div class="rail-avatar" id="railAvatar">YOU</div>
  </nav>

  <!-- ===================== TEAMS SIDEBAR ===================== -->
  <aside class="teams-sidebar" aria-label="Teams list">
    <div class="sidebar-header">
      <span>Teams</span>
    </div>
    <div class="team-group">
      <div class="team-row">
        <div class="team-icon" style="background:#5b5fc7">PA</div>
        <span class="team-name">Project Atlas</span>
      </div>
      <div class="channel-list">
        <div class="channel-row active">
          <span class="hash">#</span><span>General</span>
        </div>
        <div class="channel-row">
          <span class="hash">#</span><span>Planning</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- ===================== MAIN CONTENT ===================== -->
  <main class="main-content">
    <div class="content-topbar">
      <div class="tabs">
        <div class="tab">Posts</div>
        <div class="tab active">Files</div>
      </div>
    </div>

    <div class="files-toolbar">
      <div class="breadcrumb">
        <span>Documents</span>
        <span class="crumb-sep">&rsaquo;</span>
        <span class="crumb-current">General</span>
      </div>
      <div class="toolbar-actions">
        <button class="btn-upload" tabindex="-1">+ Create or upload</button>
      </div>
    </div>

    <div class="file-list" role="table" aria-label="File list">
      <div class="file-row header-row" role="row">
        <div class="col-name">Name</div>
        <div class="col-modified">Modified</div>
        <div class="col-by">Modified By</div>
      </div>

      <div class="file-row" role="row" id="mainFileRow">
        <div class="col-name">
          <span class="file-icon xlsx" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 3h11l5 5v13H4z"/><path d="M15 3v5h5"/></svg>
          </span>
          <span class="file-name" id="fileNameLabel">Project Atlas – Q3 Pricing.xlsx</span>
          <button class="row-action share-trigger" id="shareTrigger" title="Share">
            <svg viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M16 6l-4-4-4 4M12 2v14"/></svg>
          </button>
          <button class="row-action" tabindex="-1" title="More options">
            <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
          </button>
        </div>
        <div class="col-modified" id="modifiedLabel">Today</div>
        <div class="col-by">You</div>
      </div>

      <div class="file-row" role="row" aria-hidden="true">
        <div class="col-name">
          <span class="file-icon docx" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 3h11l5 5v13H4z"/><path d="M15 3v5h5"/></svg>
          </span>
          <span class="file-name muted">Kickoff Notes.docx</span>
        </div>
        <div class="col-modified">Last week</div>
        <div class="col-by">Alex Chen</div>
      </div>
    </div>
  </main>

  <!-- ===================== SHARE DIALOG ===================== -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="share-modal" role="dialog" aria-modal="true" aria-labelledby="shareModalTitle">
      <div class="share-modal-header">
        <h2 id="shareModalTitle">Share "<span id="shareFileName">file</span>"</h2>
        <button class="modal-close" id="modalCloseBtn" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="share-modal-body">
        <div class="recipient-field">
          <label for="recipientInput" class="sr-only">Add a name, group, or email</label>
          <div class="recipient-input-wrap" id="recipientInputWrap">
            <svg class="field-icon" viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 6l8 6 8-6"/></svg>
            <div class="chip-area" id="chipArea"></div>
            <input type="text" id="recipientInput" placeholder="Add a name, group, or email" autocomplete="off" />
          </div>
          <div class="autocomplete-list" id="autocompleteList" hidden></div>
        </div>

        <!-- This area is replaced by the system-generated security message once a recipient is selected -->
        <div class="message-area" id="messageArea">
          <textarea id="messageBox" placeholder="Add a message" readonly></textarea>
        </div>

        <div class="security-panel" id="securityPanel" hidden>
          <div class="security-panel-title">
            <svg viewBox="0 0 24 24"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/></svg>
            <span>Sharing Check</span>
          </div>
          <div class="security-panel-body" id="securityPanelBody">
            <!-- facts / warrant / claim injected by script.js -->
          </div>
        </div>
      </div>

      <div class="share-modal-footer">
        <div class="footer-left">
          <button class="btn-secondary" id="copyLinkBtn">
            <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007 0l3-3a5 5 0 10-7-7l-1 1M14 11a5 5 0 00-7 0l-3 3a5 5 0 107 7l1-1"/></svg>
            <span id="copyLinkLabel">Copy link</span>
          </button>
        </div>
        <div class="footer-right">
          <button class="btn-cancel" id="dontShareBtn" hidden><span id="cancelLabel">Cancel</span></button>
          <button class="btn-primary" id="sendBtn" disabled>
            <svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            <span id="sendLabel">Send</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== TOAST ===================== -->
  <div class="toast" id="toast" hidden></div>

  <!-- ===================== DEBUG PANEL ===================== -->
  <div class="debug-panel" id="debugPanel" hidden>
    <div class="debug-header">Debug</div>
    <div class="debug-row"><span>Condition</span><b id="dbgCondition">-</b></div>
    <div class="debug-row"><span>ambiguity</span><b id="dbgAmbiguity">-</b></div>
    <div class="debug-row"><span>warrant</span><b id="dbgWarrant">-</b></div>
    <div class="debug-row"><span>share</span><b id="dbgShare">-</b></div>
    <div class="debug-row"><span>UI state</span><b id="dbgState">-</b></div>
    <div class="debug-log-title">Event log</div>
    <div class="debug-log" id="dbgLog"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
